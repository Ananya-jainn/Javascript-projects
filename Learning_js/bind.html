<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>react</title>
</head>
<body style="background-color: #212121;">
   <button> button clicked </button>
</body>
<script>
    class React{
        constructor(){
            this.lib = "React"
            this.server = "http://localhost:300"
            //requirement
            document
            .querySelector('button')
            .addEventListener('click'.this.handleClick.bind(this))  /// bind humara bind karta hai react se with handleclick and all
            

        }
        handleClick(){
            console.log("button clicked");
            console.log(this.server);
        }
    }

    const app = new React()
</script>
</html>
